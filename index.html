<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>TSK 96 Active Pass</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/html5-qrcode"></script>
<script src="./config.js"></script>

<style>
:root{
  --g:#0e5b3c;
  --lg:#99e84d;
  --bg:#f6f7f4;
  --ink:#131713;
  --muted:#68716b;
  --card:#fff;
  --danger:#b42318;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;
  background:var(--bg);
  color:var(--ink);
}

header{
  background:linear-gradient(135deg,#0b3526,#0e5b3c);
  color:#fff;
  padding:14px 16px 16px;
  border-radius:0 0 24px 24px;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
}

.brand img{
  width:72px;
  height:72px;
  object-fit:contain;
  background:#fff;
  border-radius:14px;
  padding:5px;
}

.brandText{
  flex:1;
  min-width:170px;
}

header h1{
  margin:0;
  font-size:24px;
}

.sub{
  opacity:.85;
  margin-top:4px;
  font-size:13px;
}

.header-actions{
  display:flex;
  align-items:center;
  gap:7px;
}

.lang-switch{
  display:flex;
  gap:5px;
  align-items:center;
}

.lang-switch button{
  width:auto;
  padding:8px 9px;
  border-radius:10px;
  background:#ffffff1f;
  border:1px solid #ffffff55;
  color:#fff;
  font-size:12px;
  white-space:nowrap;
}

.lang-switch button.active{
  background:#fff;
  color:#0e5b3c;
}

.logout{
  width:auto!important;
  padding:9px 11px!important;
  background:#ffffff1f!important;
  border:1px solid #ffffff55!important;
  color:#fff!important;
  border-radius:12px!important;
  font-size:12px!important;
  white-space:nowrap;
}

.wrap{
  max-width:920px;
  margin:auto;
  padding:14px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.card{
  background:#fff;
  border-radius:18px;
  padding:14px;
  box-shadow:0 4px 16px #0000000d;
  margin-bottom:12px;
}

.stat{
  font-size:28px;
  font-weight:800;
  color:var(--g);
}

.label{
  font-size:13px;
  color:var(--muted);
}

input,
select,
button{
  width:100%;
  padding:13px 14px;
  border-radius:13px;
  border:1px solid #d8ded9;
  font-size:16px;
  background:#fff;
}

button{
  border:none;
  background:var(--g);
  color:#fff;
  font-weight:700;
  cursor:pointer;
  -webkit-appearance:none;
  appearance:none;
}

button.secondary,
button.warn{
  background:var(--g);
  color:#fff;
}

button:disabled,
button.secondary:disabled,
button.warn:disabled{
  background:#d7ddd9!important;
  color:#8a938d!important;
  border-color:#d7ddd9!important;
  cursor:not-allowed!important;
  opacity:1!important;
}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.row3{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:8px;
}

.badge{
  display:inline-block;
  padding:7px 10px;
  border-radius:999px;
  background:#e9f6e4;
  color:#195c39;
  font-size:13px;
  font-weight:700;
}

.visit{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  padding:10px 0;
  border-bottom:1px solid #eef1ef;
}

.visit:last-child{
  border-bottom:0;
}

.ok{
  color:#177245;
  font-weight:700;
}

.no{
  color:#8c9690;
}

.danger{
  color:var(--danger);
  font-weight:700;
}

#reader{
  width:100%;
  overflow:hidden;
  border-radius:16px;
}

.small{
  font-size:12px;
  color:var(--muted);
}

.hidden{
  display:none;
}

.pass-title{
  font-size:24px;
  font-weight:900;
  letter-spacing:.4px;
}

hr{
  border:none;
  border-top:1px solid #eef1ef;
  margin:14px 0;
}

table{
  width:100%;
  border-collapse:collapse;
  font-size:13px;
}

th,td{
  padding:8px;
  border-bottom:1px solid #eee;
  text-align:start;
}

@media(max-width:600px){
  .brand img{
    width:60px;
    height:60px;
  }

  header h1{
    font-size:20px;
  }

  .header-actions{
    width:100%;
    justify-content:space-between;
  }

  .lang-switch{
    flex:1;
  }

  .lang-switch button{
    flex:1;
  }
}

@media(min-width:720px){
  .grid{
    grid-template-columns:repeat(4,1fr);
  }

  .two{
    display:grid;
    grid-template-columns:1fr 1.3fr;
    gap:12px;
  }
}
</style>
</head>

<body>

<header>
  <div class="brand">

    <img src="./IMG_6646.jpeg" alt="TSK Active Company">

    <div class="brandText">
      <h1>TSK 96 ACTIVE PASS</h1>
      <div class="sub" id="subTitle">
        نظام موحد للفروع • الصفوة • المجمعة • المزاحمية
      </div>
    </div>

    <div class="header-actions">

      <div class="lang-switch">
        <button
          id="arBtn"
          type="button"
          onclick="setLanguage('ar')">
          العربية
        </button>

        <button
          id="enBtn"
          type="button"
          onclick="setLanguage('en')">
          English
        </button>
      </div>

      <button
        class="logout"
        id="logoutBtn"
        onclick="logoutStaff()">
        تسجيل الخروج
      </button>

    </div>

  </div>
</header>


<div class="wrap">

  <div class="grid">

    <div class="card">
      <div id="sold" class="stat">—</div>
      <div class="label" id="soldLabel">بطاقات مباعة</div>
    </div>

    <div class="card">
      <div id="cups" class="stat">—</div>
      <div class="label" id="cupsLabel">أكواب تم تسليمها</div>
    </div>

    <div class="card">
      <div id="visits" class="stat">—</div>
      <div class="label" id="visitsLabel">إجمالي الزيارات</div>
    </div>

    <div class="card">
      <div id="remaining" class="stat">—</div>
      <div class="label" id="remainingLabel">بطاقات متاحة</div>
    </div>

  </div>


  <div class="two">

    <div>

      <div class="card">

        <b id="staffTitle">بيانات الموظف</b>

        <div class="row" style="margin-top:10px">

          <select id="branch">
            <option value="الصفوة">الصفوة</option>
            <option value="المجمعة">المجمعة</option>
            <option value="المزاحمية">المزاحمية</option>
          </select>

          <input
            id="employee"
            placeholder="اسم الموظف"
            readonly
            style="background:#f2f5f2;font-weight:800;color:#0e5b3c"
          />

        </div>
      </div>


      <div class="card">

        <b id="qrTitle">مسح QR</b>

        <div id="reader" style="margin-top:10px"></div>

        <button
          class="secondary"
          onclick="toggleScanner()"
          id="scanBtn">
          تشغيل الكاميرا
        </button>

        <div
          class="small"
          id="qrHelp"
          style="margin-top:8px">
          يمكن أيضاً إدخال رقم البطاقة يدوياً.
        </div>

      </div>


      <div class="card">

        <b id="searchTitle">بحث عن بطاقة</b>

        <div class="row" style="margin-top:10px">

          <input
            id="passId"
            placeholder="TSK96-001"
            dir="ltr"
          />

          <button
            id="showPassBtn"
            onclick="loadPass()">
            عرض البطاقة
          </button>

        </div>

      </div>

    </div>


    <div>

      <div id="passCard" class="card hidden">

        <div class="pass-title" id="p_id"></div>

        <div style="margin:8px 0">
          <span id="p_status" class="badge"></span>
        </div>


        <div class="row">

          <input
            id="customerName"
            placeholder="اسم العميل"
            required
          />

          <input
            id="customerPhone"
            placeholder="رقم الجوال"
            inputmode="tel"
            required
          />

        </div>


        <div class="row" style="margin-top:10px">

          <button
            id="payBtn"
            onclick="activatePass()"
            disabled>
            تسجيل الدفع 96 ريال
          </button>

          <button
            id="saveCustomerBtn"
            class="secondary"
            onclick="saveCustomer()">
            حفظ بيانات العميل
          </button>

        </div>

        <hr>

        <div id="visitList"></div>

        <div class="row" style="margin-top:12px">

          <button
            id="visitBtn"
            onclick="useVisit()"
            disabled>
            تسجيل الزيارة الحالية
          </button>

          <button
            id="cupBtn"
            class="warn"
            onclick="giveCup()"
            disabled>
            تسجيل تسليم الكوب
          </button>

        </div>

        <div id="msg" style="margin-top:12px"></div>

      </div>

    </div>

  </div>


  <div class="card">

    <b id="recentTitle">آخر العمليات</b>

    <div style="overflow:auto;margin-top:8px">

      <table>

        <thead>
          <tr>
            <th id="thPass">البطاقة</th>
            <th id="thVisit">الزيارة</th>
            <th id="thBranch">الفرع</th>
            <th id="thEmployee">الموظف</th>
            <th id="thTime">الوقت</th>
          </tr>
        </thead>

        <tbody id="recent"></tbody>

      </table>

    </div>

  </div>

</div>


<script>

const cfg = window.TSK96_CONFIG || {};

let currentLang =
  localStorage.getItem("tsk96_lang") || "ar";

let sb = null;
let scanner = null;
let scanning = false;
let current = null;
let staffName = "";


/* =========================
   العناصر
========================= */

const passId = document.getElementById("passId");
const passCard = document.getElementById("passCard");

const p_id = document.getElementById("p_id");
const p_status = document.getElementById("p_status");

const custName = document.getElementById("customerName");
const custPhone = document.getElementById("customerPhone");

const payBtn = document.getElementById("payBtn");
const saveCustomerBtn = document.getElementById("saveCustomerBtn");
const visitBtn = document.getElementById("visitBtn");
const cupBtn = document.getElementById("cupBtn");

const employee = document.getElementById("employee");
const branch = document.getElementById("branch");

const msg = document.getElementById("msg");
const visitList = document.getElementById("visitList");
const recent = document.getElementById("recent");

const sold = document.getElementById("sold");
const cups = document.getElementById("cups");
const visits = document.getElementById("visits");
const remaining = document.getElementById("remaining");

const scanBtn = document.getElementById("scanBtn");


/* =========================
   اللغة
========================= */

const text = {

  ar:{
    sub:
      "نظام موحد للفروع • الصفوة • المجمعة • المزاحمية",

    logout:"تسجيل الخروج",

    sold:"بطاقات مباعة",
    cups:"أكواب تم تسليمها",
    visits:"إجمالي الزيارات",
    remaining:"بطاقات متاحة",

    staff:"بيانات الموظف",
    employeePlaceholder:"اسم الموظف",

    qr:"مسح QR",
    startCamera:"تشغيل الكاميرا",
    stopCamera:"إيقاف الكاميرا",
    qrHelp:"يمكن أيضاً إدخال رقم البطاقة يدوياً.",

    search:"بحث عن بطاقة",
    showPass:"عرض البطاقة",

    customerName:"اسم العميل",
    customerPhone:"رقم الجوال",

    pay:"تسجيل الدفع 96 ريال",
    paid:"تم تسجيل الدفع ✓",
    saveCustomer:"حفظ بيانات العميل",

    useVisit:"تسجيل الزيارة الحالية",
    giveCup:"تسجيل تسليم الكوب",

    recent:"آخر العمليات",

    thPass:"البطاقة",
    thVisit:"الزيارة",
    thBranch:"الفرع",
    thEmployee:"الموظف",
    thTime:"الوقت",

    available:"متاحة ولم تُبع",
    active:"مفعّلة",
    visitWord:"زيارات",

    visit:"الزيارة",
    remainingVisit:"متبقية",

    cup:"الكوب",
    cupReceived:"تم الاستلام في",
    cupNotReceived:"لم يُسلّم",

    passNotFound:"البطاقة غير موجودة",

    customerRequired:"يرجى إدخال اسم العميل أولاً",
    phoneInvalid:
      "يرجى إدخال رقم جوال سعودي صحيح مثل 05XXXXXXXX",

    customerSaved:
      "تم حفظ بيانات العميل ✓ يمكنك الآن تسجيل الدفع.",

    alreadyActive:"البطاقة مفعّلة بالفعل.",

    paymentSuccess:
      "تم تسجيل دفع 96 ريال وتفعيل البطاقة ✓",

    paymentFirst:"يجب تسجيل دفع 96 ريال أولاً",

    staffError:"تعذر تحديد حساب الموظف",

    visitsFinished:"تم استخدام الزيارات الثلاث.",

    visitRegistered:"تم تسجيل الزيارة",
    remainingCount:"المتبقي",

    cupAlready:"تم تسجيل تسليم الكوب مسبقاً",
    cupSuccess:"تم تسجيل تسليم الكوب ✓",

    configError:
      "أضيفي بيانات Supabase في ملف config.js أولاً.",

    staffNameError:
      "اسم الموظف غير مُعرّف في الحساب. تواصلي مع الإدارة.",

    saveError:"تعذر حفظ بيانات العميل",
    paymentError:"تعذر تسجيل الدفع",

    cameraError:"تعذر تشغيل الكاميرا"
  },


  en:{
    sub:
      "Unified Branch System • Al Safwa • Al Majmaah • Al Muzahimiyah",

    logout:"Logout",

    sold:"Passes Sold",
    cups:"Cups Delivered",
    visits:"Total Visits",
    remaining:"Available Passes",

    staff:"Staff Information",
    employeePlaceholder:"Employee Name",

    qr:"Scan QR",
    startCamera:"Start Camera",
    stopCamera:"Stop Camera",
    qrHelp:"You can also enter the pass number manually.",

    search:"Search Pass",
    showPass:"View Pass",

    customerName:"Customer Name",
    customerPhone:"Mobile Number",

    pay:"Register Payment — SAR 96",
    paid:"Payment Registered ✓",
    saveCustomer:"Save Customer Information",

    useVisit:"Register Current Visit",
    giveCup:"Register Cup Delivery",

    recent:"Recent Transactions",

    thPass:"Pass",
    thVisit:"Visit",
    thBranch:"Branch",
    thEmployee:"Employee",
    thTime:"Time",

    available:"Available — Not Sold",
    active:"Active",
    visitWord:"Visits",

    visit:"Visit",
    remainingVisit:"Remaining",

    cup:"Cup",
    cupReceived:"Received at",
    cupNotReceived:"Not Delivered",

    passNotFound:"Pass not found",

    customerRequired:"Please enter the customer name first.",
    phoneInvalid:
      "Please enter a valid Saudi mobile number such as 05XXXXXXXX.",

    customerSaved:
      "Customer information saved ✓ You can now register the payment.",

    alreadyActive:"This pass is already active.",

    paymentSuccess:
      "SAR 96 payment registered and pass activated ✓",

    paymentFirst:"Please register the SAR 96 payment first.",

    staffError:"Unable to identify the employee account.",

    visitsFinished:"All three visits have been used.",

    visitRegistered:"Visit registered",
    remainingCount:"Remaining",

    cupAlready:"Cup delivery has already been registered.",
    cupSuccess:"Cup delivery registered ✓",

    configError:
      "Please add the Supabase configuration to config.js first.",

    staffNameError:
      "The employee name is not defined in this account. Please contact administration.",

    saveError:"Unable to save customer information",
    paymentError:"Unable to register payment",

    cameraError:"Unable to start the camera"
  }

};


function tr(key){
  return text[currentLang][key] || key;
}


function branchLabel(value){

  if(currentLang === "ar"){
    return value;
  }

  const names = {
    "الصفوة":"Al Safwa",
    "المجمعة":"Al Majmaah",
    "المزاحمية":"Al Muzahimiyah"
  };

  return names[value] || value;
}


function updateBranchLabels(){

  [...branch.options].forEach(option => {
    option.textContent =
      branchLabel(option.value);
  });
}


function setLanguage(lang){

  currentLang =
    lang === "en" ? "en" : "ar";

  localStorage.setItem(
    "tsk96_lang",
    currentLang
  );

  applyLanguage();
}


function applyLanguage(){

  const en =
    currentLang === "en";

  document.documentElement.lang =
    en ? "en" : "ar";

  document.documentElement.dir =
    en ? "ltr" : "rtl";


  document.getElementById("subTitle").textContent =
    tr("sub");

  document.getElementById("logoutBtn").textContent =
    tr("logout");


  document.getElementById("soldLabel").textContent =
    tr("sold");

  document.getElementById("cupsLabel").textContent =
    tr("cups");

  document.getElementById("visitsLabel").textContent =
    tr("visits");

  document.getElementById("remainingLabel").textContent =
    tr("remaining");


  document.getElementById("staffTitle").textContent =
    tr("staff");

  employee.placeholder =
    tr("employeePlaceholder");


  document.getElementById("qrTitle").textContent =
    tr("qr");

  scanBtn.textContent =
    scanning
      ? tr("stopCamera")
      : tr("startCamera");

  document.getElementById("qrHelp").textContent =
    tr("qrHelp");


  document.getElementById("searchTitle").textContent =
    tr("search");

  document.getElementById("showPassBtn").textContent =
    tr("showPass");


  custName.placeholder =
    tr("customerName");

  custPhone.placeholder =
    tr("customerPhone");


  saveCustomerBtn.textContent =
    tr("saveCustomer");

  visitBtn.textContent =
    tr("useVisit");

  cupBtn.textContent =
    tr("giveCup");


  document.getElementById("recentTitle").textContent =
    tr("recent");

  document.getElementById("thPass").textContent =
    tr("thPass");

  document.getElementById("thVisit").textContent =
    tr("thVisit");

  document.getElementById("thBranch").textContent =
    tr("thBranch");

  document.getElementById("thEmployee").textContent =
    tr("thEmployee");

  document.getElementById("thTime").textContent =
    tr("thTime");


  document.getElementById("arBtn")
    .classList.toggle("active", !en);

  document.getElementById("enBtn")
    .classList.toggle("active", en);


  updateBranchLabels();


  if(current){
    renderCurrentPass();
  }

  if(sb){
    refreshDashboard();
  }
}


/* =========================
   التحقق
========================= */

function validPhone(phone){
  return /^05\d{8}$/.test(
    (phone || "").replace(/\D/g,"")
  );
}


function customerIsValid(p){
  return !!(
    p &&
    (p.customer_name || "").trim() &&
    validPhone(p.phone)
  );
}


function checkConfig(){

  if(
    !cfg.SUPABASE_URL ||
    cfg.SUPABASE_URL.includes("PASTE_")
  ){

    alert(tr("configError"));

    return false;
  }

  sb = supabase.createClient(
    cfg.SUPABASE_URL,
    cfg.SUPABASE_ANON_KEY
  );

  return true;
}


/* =========================
   تسجيل الدخول
========================= */

async function init(){

  applyLanguage();

  if(!checkConfig()) return;


  const {
    data:{session}
  } = await sb.auth.getSession();


  if(!session){

    location.replace("./login.html");

    return;
  }


  staffName =
    (session.user?.user_metadata?.name || "")
    .trim();


  if(!staffName){

    alert(tr("staffNameError"));

    await sb.auth.signOut();

    location.replace("./login.html");

    return;
  }


  employee.value =
    staffName;


  const b =
    localStorage.getItem("tsk96_branch");


  if(b){
    branch.value = b;
  }


  updateBranchLabels();


  branch.onchange = () => {

    localStorage.setItem(
      "tsk96_branch",
      branch.value
    );

  };


  await refreshDashboard();
}


/* =========================
   تسجيل الخروج
========================= */

async function logoutStaff(){

  if(sb){
    await sb.auth.signOut();
  }

  location.replace("./login.html");
}


/* =========================
   لوحة الإحصائيات
========================= */

async function refreshDashboard(){

  if(!sb) return;


  const {data:ps} =
    await sb
    .from("tsk96_passes")
    .select("id,paid,cup_received,visit_count");


  if(ps){

    sold.textContent =
      ps.filter(x => x.paid).length;

    cups.textContent =
      ps.filter(x => x.cup_received).length;

    visits.textContent =
      ps.reduce(
        (a,x) =>
          a + (x.visit_count || 0),
        0
      );

    remaining.textContent =
      ps.filter(x => !x.paid).length;
  }


  const {data:v} =
    await sb
    .from("tsk96_visits")
    .select("*")
    .order(
      "created_at",
      {ascending:false}
    )
    .limit(12);


  const locale =
    currentLang === "en"
      ? "en-US"
      : "ar-SA";


  recent.innerHTML =
    (v || [])
    .map(x => `

      <tr>

        <td>${x.pass_id}</td>

        <td>${x.visit_no}</td>

        <td>${branchLabel(x.branch)}</td>

        <td>${x.employee || ""}</td>

        <td>
          ${new Date(x.created_at)
            .toLocaleString(locale)}
        </td>

      </tr>

    `)
    .join("");
}


/* =========================
   عرض البطاقة
========================= */

function renderCurrentPass(){

  if(!current) return;


  const p =
    current;


  const hasCustomer =
    customerIsValid(p);


  p_id.textContent =
    p.id;


  custName.value =
    p.customer_name || "";

  custPhone.value =
    p.phone || "";


  p_status.textContent =
    p.paid
      ? `${tr("active")} • ${p.visit_count || 0}/3 ${tr("visitWord")}`
      : tr("available");


  saveCustomerBtn.disabled =
    !!p.paid ||
    hasCustomer;


  payBtn.disabled =
    !!p.paid ||
    !hasCustomer;


  payBtn.textContent =
    p.paid
      ? tr("paid")
      : tr("pay");


  visitBtn.disabled =
    !p.paid ||
    !p.active ||
    !hasCustomer ||
    (p.visit_count || 0) >= 3;


  cupBtn.disabled =
    !p.paid ||
    !p.active ||
    !hasCustomer ||
    !!p.cup_received;
}


async function renderVisits(){

  if(!current || !sb) return;


  const {data:v} =
    await sb
    .from("tsk96_visits")
    .select("*")
    .eq(
      "pass_id",
      current.id
    )
    .order("visit_no");


  const by = {};


  (v || []).forEach(x => {

    by[x.visit_no] = x;

  });


  const locale =
    currentLang === "en"
      ? "en-US"
      : "ar-SA";


  visitList.innerHTML =

    [1,2,3]

    .map(n =>

      by[n]

      ?

      `<div class="visit">

        <b>
          ${tr("visit")} ${n}
        </b>

        <span class="ok">

          ✓ ${branchLabel(by[n].branch)}

          —

          ${new Date(by[n].created_at)
            .toLocaleString(locale)}

        </span>

      </div>`

      :

      `<div class="visit">

        <b>
          ${tr("visit")} ${n}
        </b>

        <span class="no">
          ${tr("remainingVisit")}
        </span>

      </div>`

    )

    .join("")

    +

    `<div class="visit">

      <b>
        ${tr("cup")}
      </b>

      <span class="${current.cup_received ? "ok" : "no"}">

        ${
          current.cup_received

          ? "✓ " +
            tr("cupReceived") +
            " " +
            branchLabel(current.cup_branch || "")

          : tr("cupNotReceived")
        }

      </span>

    </div>`;
}


/* =========================
   تحميل البطاقة
========================= */

async function loadPass(id){

  if(!sb) return;


  id =
    (id || passId.value)
    .trim()
    .toUpperCase();


  if(!id) return;


  const {data:p,error} =
    await sb
    .from("tsk96_passes")
    .select("*")
    .eq("id",id)
    .single();


  if(error || !p){

    alert(tr("passNotFound"));

    return;
  }


  current =
    p;


  passId.value =
    id;


  passCard.classList.remove(
    "hidden"
  );


  renderCurrentPass();

  await renderVisits();


  msg.innerHTML = "";
}


/* =========================
   حفظ بيانات العميل
========================= */

async function saveCustomer(){

  if(!current) return;


  if(current.paid){

    alert(tr("alreadyActive"));

    return;
  }


  const name =
    (custName.value || "")
    .trim();


  const phone =
    (custPhone.value || "")
    .replace(/\D/g,"");


  if(!name){

    alert(tr("customerRequired"));

    custName.focus();

    return;
  }


  if(!validPhone(phone)){

    alert(tr("phoneInvalid"));

    custPhone.focus();

    return;
  }


  const {error} =
    await sb
    .from("tsk96_passes")
    .update({

      customer_name:name,

      phone:phone,

      updated_at:
        new Date().toISOString()

    })
    .eq(
      "id",
      current.id
    );


  if(error){

    alert(
      tr("saveError") +
      ": " +
      error.message
    );

    return;
  }


  current.customer_name =
    name;

  current.phone =
    phone;


  saveCustomerBtn.disabled =
    true;


  payBtn.disabled =
    false;


  visitBtn.disabled =
    true;

  cupBtn.disabled =
    true;


  msg.innerHTML =
    `<span class="ok">
      ${tr("customerSaved")}
    </span>`;
}


/* =========================
   تسجيل الدفع
========================= */

async function activatePass(){

  if(!current) return;


  if(current.paid){
    return;
  }


  const name =
    (custName.value || "")
    .trim();


  const phone =
    (custPhone.value || "")
    .replace(/\D/g,"");


  if(!name){

    alert(tr("customerRequired"));

    return;
  }


  if(!validPhone(phone)){

    alert(tr("phoneInvalid"));

    return;
  }


  const {error} =
    await sb
    .from("tsk96_passes")
    .update({

      customer_name:name,

      phone:phone,

      paid:true

    })
    .eq(
      "id",
      current.id
    );


  if(error){

    alert(
      tr("paymentError") +
      ": " +
      error.message
    );

    return;
  }


  msg.innerHTML =
    `<span class="ok">
      ${tr("paymentSuccess")}
    </span>`;


  await loadPass(
    current.id
  );


  await refreshDashboard();
}


/* =========================
   تسجيل زيارة
========================= */

async function useVisit(){

  if(!current) return;


  if(!current.paid){

    alert(tr("paymentFirst"));

    return;
  }


  if(!staffName){

    alert(tr("staffError"));

    return;
  }


  if(
    (current.visit_count || 0) >= 3
  ){

    alert(tr("visitsFinished"));

    return;
  }


  const {data,error} =
    await sb.rpc(
      "tsk96_use_visit",
      {

        p_pass_id:
          current.id,

        p_branch:
          branch.value,

        p_employee:
          staffName

      }
    );


  if(error){

    msg.innerHTML =
      '<span class="danger">' +
      error.message +
      '</span>';

    return;
  }


  if(data?.ok){

    msg.innerHTML =
      `<span class="ok">

        ${tr("visitRegistered")} ✓

        ${
          typeof data.remaining !== "undefined"

          ? " — " +
            tr("remainingCount") +
            " " +
            data.remaining

          : ""
        }

      </span>`;

  }else{

    msg.innerHTML =
      `<span class="danger">
        ${data?.message || ""}
      </span>`;
  }


  await loadPass(
    current.id
  );


  await refreshDashboard();
}


/* =========================
   تسليم الكوب
========================= */

async function giveCup(){

  if(!current) return;


  if(!current.paid){

    alert(tr("paymentFirst"));

    return;
  }


  if(current.cup_received){

    alert(tr("cupAlready"));

    return;
  }


  const {data,error} =
    await sb.rpc(
      "tsk96_give_cup",
      {

        p_pass_id:
          current.id,

        p_branch:
          branch.value

      }
    );


  if(error){

    msg.innerHTML =
      '<span class="danger">' +
      error.message +
      '</span>';

    return;
  }


  if(data?.ok){

    msg.innerHTML =
      `<span class="ok">

        ${tr("cupSuccess")}

        ${
          data.branch
          ? " — " +
            branchLabel(data.branch)
          : ""
        }

      </span>`;

  }else{

    msg.innerHTML =
      `<span class="danger">
        ${data?.message || ""}
      </span>`;
  }


  await loadPass(
    current.id
  );


  await refreshDashboard();
}


/* =========================
   قراءة QR
========================= */

function onScan(txt){

  let id =
    (txt || "")
    .trim()
    .toUpperCase();


  if(id.includes("TSK96-")){

    const m =
      id.match(/TSK96-\d{3}/);


    if(m){
      id = m[0];
    }


    passId.value =
      id;


    loadPass(id);
  }


  if(scanning){

    toggleScanner();
  }
}


/* =========================
   الكاميرا
========================= */

async function toggleScanner(){

  if(!scanning){

    scanner =
      new Html5Qrcode(
        "reader"
      );


    try{

      await scanner.start(

        {
          facingMode:
            "environment"
        },

        {
          fps:10,
          qrbox:220
        },

        onScan,

        ()=>{}

      );


      scanning =
        true;


      scanBtn.textContent =
        tr("stopCamera");


    }catch(e){

      alert(
        tr("cameraError") +
        ": " +
        e
      );
    }

  }else{

    try{

      await scanner.stop();

      await scanner.clear();

    }catch(e){}


    scanning =
      false;


    scanBtn.textContent =
      tr("startCamera");
  }
}


/* تشغيل النظام */

window.addEventListener(
  "load",
  init
);
