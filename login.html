<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>دخول الموظفين | TSK 96</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./config.js"></script>
<style>
:root{--g:#0e5b3c;--bg:#f6f7f4;--ink:#131713;--muted:#748078;--card:#fff;--danger:#b42318}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink)}
.wrap{max-width:480px;margin:auto;padding:28px 18px}.hero{text-align:center;padding:18px}.logo{width:120px;height:120px;object-fit:contain;background:#fff;border-radius:24px;padding:8px;box-shadow:0 5px 20px #0000000c}
h1{color:var(--g);margin:14px 0 4px}.sub{color:var(--muted)}
.card{background:#fff;border-radius:24px;padding:20px;box-shadow:0 5px 20px #0000000c;margin-top:18px}
input,button{width:100%;padding:14px;border-radius:14px;font-size:16px;margin-top:10px}
input{border:1px solid #d7ddd8}button{border:0;background:var(--g);color:#fff;font-weight:800}
.msg{text-align:center;margin-top:12px;font-weight:700}.danger{color:var(--danger)}.ok{color:var(--g)}.small{text-align:center;color:var(--muted);font-size:12px;line-height:1.6;margin-top:12px}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <img class="logo" src="./tsk-logo.jpg" alt="TSK Active Company">
    <h1>دخول موظفي TSK</h1>
    <div class="sub">96 ACTIVE PASS</div>
  </div>
  <div class="card">
    <input id="phone" type="tel" inputmode="tel" autocomplete="username" placeholder="رقم جوال الموظف" dir="ltr">
    <input id="password" type="password" autocomplete="current-password" placeholder="كلمة المرور">
    <button id="loginBtn" onclick="login()">دخول النظام</button>
    <div id="msg" class="msg"></div>
    <div class="small">هذه الصفحة للموظفين فقط. حسابات الموظفين تُنشأ من لوحة Supabase ولا يوجد تسجيل ذاتي.</div>
  </div>
</div>
<script>
const cfg=window.TSK96_CONFIG||{};
let sb=null;
function init(){
  if(!cfg.SUPABASE_URL || !cfg.SUPABASE_ANON_KEY){msg.textContent='إعداد الاتصال غير مكتمل';msg.className='msg danger';return}
  sb=supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY);
  sb.auth.getSession().then(({data})=>{ if(data?.session) location.replace('./index.html'); });
}
async function login(){
  if(!sb)return;
  const btn=document.getElementById('loginBtn');
  const m=document.getElementById('msg');
  btn.disabled=true;m.textContent='جاري تسجيل الدخول…';m.className='msg';
  const rawPhone=phone.value.trim();
  let digits=rawPhone.replace(/\D/g,'');
  if(/^05\d{8}$/.test(digits)) digits='00966'+digits.slice(1);
  else if(/^9665\d{8}$/.test(digits)) digits='00'+digits;
  else if(!/^00\d{10,15}$/.test(digits)){
    btn.disabled=false;m.textContent='أدخل رقم الجوال الصحيح';m.className='msg danger';return
  }
  const staffEmail=digits+'@staff.tsk96.local';
  const {error}=await sb.auth.signInWithPassword({email:staffEmail,password:password.value});
  btn.disabled=false;
  if(error){m.textContent='بيانات الدخول غير صحيحة أو الحساب غير مفعّل';m.className='msg danger';return}
  m.textContent='تم الدخول';m.className='msg ok';
  location.replace('./index.html');
}
window.addEventListener('load',init);
</script>
</body>
</html>
