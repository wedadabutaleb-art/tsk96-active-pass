<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>بطاقتي | TSK 96 Active Pass</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./config.js"></script>
<style>
:root{--g:#0e5b3c;--bg:#f6f7f4;--ink:#131713;--muted:#748078;--card:#fff;--soft:#e9f6e4}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink)}
.wrap{max-width:560px;margin:auto;padding:18px}.hero{text-align:center;padding:20px 0 10px}.logo{width:120px;height:120px;object-fit:contain;background:#fff;border-radius:24px;padding:8px;box-shadow:0 5px 20px #0000000c}.hero h1{margin:12px 0 2px;font-size:26px;color:var(--g)}.hero p{margin:0;color:var(--muted)}
.card{background:var(--card);border-radius:24px;padding:20px;box-shadow:0 5px 20px #0000000c;margin:14px 0}.passid{font-size:30px;font-weight:900;direction:ltr;text-align:center}.badge{display:block;width:max-content;margin:10px auto;padding:8px 13px;border-radius:999px;background:var(--soft);color:var(--g);font-weight:800}
.progress{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}.step{border-radius:18px;padding:14px 8px;text-align:center;background:#f0f2f0;color:#9aa29d;font-weight:800}.step.used{background:var(--g);color:#fff}.step b{display:block;font-size:22px;margin-bottom:4px}.row{display:flex;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid #edf0ed}.row:last-child{border:0}.ok{color:var(--g);font-weight:800}.muted{color:var(--muted)}
.lookup{display:flex;gap:8px}.lookup input{flex:1;min-width:0;padding:14px;border:1px solid #d7ddd8;border-radius:14px;font-size:17px;text-align:center;direction:ltr}.lookup button{border:0;border-radius:14px;background:var(--g);color:#fff;font-weight:800;padding:0 18px;font-size:16px}.note{text-align:center;color:var(--muted);font-size:13px;line-height:1.7}.hidden{display:none}.error{color:#b42318;text-align:center;font-weight:700}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero"><img class="logo" src="./tsk-logo.jpg" alt="TSK Active Company"><h1>TSK 96 ACTIVE PASS</h1><p>بطاقتك الرياضية في فروع TSK Active</p></div>
  <div class="card">
    <div class="lookup"><input id="passInput" placeholder="TSK96-001"><button onclick="loadCustomerPass()">عرض</button></div>
    <div class="note" style="margin-top:10px">أدخل رقم البطاقة الموجود على الكوب أو البطاقة.</div>
  </div>
  <div id="result" class="card hidden">
    <div id="pid" class="passid"></div><span id="status" class="badge"></span>
    <div id="progress" class="progress"></div>
    <div style="margin-top:18px">
      <div class="row"><b>الزيارات المستخدمة</b><span id="used"></span></div>
      <div class="row"><b>الزيارات المتبقية</b><span id="left" class="ok"></span></div>
      <div class="row"><b>الكوب</b><span id="cup"></span></div>
    </div>
  </div>
  <div id="err" class="error"></div>
  <p class="note">يتم تحديث البطاقة تلقائياً عند تسجيل الزيارة في أي فرع.</p>
</div>
<script>
const cfg = window.TSK96_CONFIG || {};
const $ = (id) => document.getElementById(id);

function normalizePass(raw){
  let id = String(raw || '').trim().toUpperCase();
  const m = id.match(/TSK96-\d{3}/);
  return m ? m[0] : id;
}

async function loadCustomerPass(raw){
  const input = $('passInput'), result = $('result'), errBox = $('err');
  const id = normalizePass(raw || input.value);
  input.value = id;
  result.classList.add('hidden');
  errBox.textContent = '';
  if(!id) return;
  if(!cfg.SUPABASE_URL || !cfg.SUPABASE_ANON_KEY){
    errBox.textContent = 'تعذر الاتصال بالنظام.'; return;
  }
  errBox.style.color = '#748078';
  errBox.textContent = 'جاري تحميل البطاقة…';
  try {
    const base = cfg.SUPABASE_URL.replace(/\/$/, '');
    const url = base + '/rest/v1/tsk96_passes?id=eq.' + encodeURIComponent(id) + '&select=id,paid,cup_received,visit_count,active';
    const r = await fetch(url, {
      method:'GET',
      headers:{'apikey':cfg.SUPABASE_ANON_KEY,'Authorization':'Bearer '+cfg.SUPABASE_ANON_KEY,'Accept':'application/json'}
    });
    if(!r.ok) throw new Error('HTTP '+r.status);
    const rows = await r.json();
    const p = rows && rows[0];
    if(!p){ errBox.style.color='#b42318'; errBox.textContent='رقم البطاقة غير موجود.'; return; }
    const count = Number(p.visit_count || 0);
    $('pid').textContent = p.id;
    $('status').textContent = !p.active ? 'البطاقة موقوفة' : p.paid ? 'مفعّلة' : 'متاحة ولم تُفعّل';
    $('used').textContent = count + ' من 3';
    $('left').textContent = Math.max(0,3-count) + ' زيارات';
    $('cup').textContent = p.cup_received ? '✓ تم الاستلام' : 'لم يُسلّم';
    $('cup').className = p.cup_received ? 'ok' : 'muted';
    $('progress').innerHTML = [1,2,3].map(n => `<div class="step ${n<=count?'used':''}"><b>${n}</b>زيارة ${n}</div>`).join('');
    errBox.textContent='';
    result.classList.remove('hidden');
  } catch(e){
    console.error(e);
    errBox.style.color='#b42318';
    errBox.textContent='تعذر قراءة البطاقة من النظام. تأكد من الإنترنت ثم حاول مرة أخرى.';
  }
}

$('passInput').addEventListener('keydown', e => { if(e.key==='Enter') loadCustomerPass(); });
window.addEventListener('load', () => {
  const q = new URLSearchParams(location.search).get('pass');
  if(q){ $('passInput').value=q; loadCustomerPass(q); }
});
</script>
</body>
</html>
