<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>بطاقتي | TSK 96 Active Pass</title>

<script src="./config.js"></script>
<script src="https://unpkg.com/html5-qrcode"></script>

<style>
:root{
  --g:#0e6b46;
  --g2:#09583a;
  --bg:#f6f8f6;
  --ink:#131713;
  --muted:#849089;
  --card:#fff;
  --line:#e7ece9;
  --danger:#b42318;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;
  background:var(--bg);
  color:var(--ink);
}

.wrap{
  max-width:560px;
  margin:auto;
  padding:18px;
}

.lang-area{
  display:flex;
  justify-content:flex-end;
  margin-bottom:4px;
}

.lang-switch{
  display:flex;
  gap:6px;
  background:#fff;
  padding:5px;
  border-radius:14px;
  box-shadow:0 4px 14px #0000000a;
}

.lang-switch button{
  width:auto;
  border:0;
  padding:8px 12px;
  border-radius:10px;
  background:#eef2ef;
  color:#536058;
  font-size:13px;
  font-weight:800;
}

.lang-switch button.active{
  background:var(--g);
  color:#fff;
}

html[dir="ltr"] .lang-area{
  justify-content:flex-start;
}

.hero{
  text-align:center;
  margin-bottom:20px;
}

.logo{
  width:125px;
  height:125px;
  object-fit:contain;
  background:#fff;
  border-radius:0 0 28px 28px;
}

h1{
  margin:20px 0 5px;
  color:var(--g);
  font-size:34px;
  font-weight:900;
}

.subtitle{
  color:var(--muted);
  font-size:18px;
}

.card{
  background:var(--card);
  border-radius:28px;
  padding:20px;
  margin-top:20px;
  box-shadow:0 12px 30px rgba(0,0,0,.05);
}

.lookup{
  display:flex;
  gap:10px;
}

.lookup input{
  flex:1;
  min-width:0;
  height:60px;
  border:1.5px solid #d6ded9;
  border-radius:18px;
  padding:0 14px;
  font-size:18px;
  text-align:center;
  outline:none;
}

.lookup input:focus{
  border-color:var(--g);
}

.showBtn{
  width:100px;
  border:0;
  border-radius:18px;
  background:var(--g);
  color:#fff;
  font-size:20px;
  font-weight:800;
}

.note{
  margin-top:14px;
  text-align:center;
  color:var(--muted);
  font-size:16px;
  line-height:1.7;
}

.or{
  display:flex;
  align-items:center;
  gap:12px;
  margin:13px 0;
  font-weight:700;
}

.or:before,
.or:after{
  content:"";
  height:1px;
  flex:1;
  background:#dfe5e1;
}

.scanBtn{
  width:100%;
  height:58px;
  border:1.5px solid var(--g);
  border-radius:18px;
  background:#eef8f2;
  color:var(--g);
  font-size:20px;
  font-weight:900;
}

#reader{
  margin-top:15px;
  overflow:hidden;
  border-radius:18px;
}

.closeBtn{
  width:100%;
  margin-top:10px;
  height:45px;
  border:0;
  border-radius:14px;
  background:#eef1ef;
  font-weight:700;
}

.hidden{display:none!important}

#error{
  text-align:center;
  margin-top:12px;
  min-height:20px;
  color:#748078;
}

.result{
  text-align:center;
}

.passid{
  font-size:38px;
  font-weight:900;
  direction:ltr;
}

.status{
  display:inline-block;
  margin:12px 0 22px;
  padding:10px 18px;
  border-radius:999px;
  background:#e7f5e7;
  color:var(--g);
  font-size:18px;
  font-weight:900;
}

.progress{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

.visit{
  background:#f0f2f1;
  color:#a0aaa4;
  border-radius:20px;
  padding:16px 5px;
  font-weight:800;
}

.visit strong{
  display:block;
  font-size:27px;
}

.visit span{
  display:block;
  margin-top:8px;
  font-size:16px;
}

.visit.done{
  background:var(--g);
  color:white;
}

.details{
  margin-top:22px;
}

.row{
  display:flex;
  justify-content:space-between;
  gap:15px;
  padding:17px 0;
  border-bottom:1px solid var(--line);
  font-size:18px;
}

.row:last-child{
  border-bottom:0;
}

.row b{
  font-weight:900;
}

.ok{
  color:var(--g);
  font-weight:900;
}

.muted{
  color:var(--muted);
  font-weight:700;
}

.footer{
  text-align:center;
  color:var(--muted);
  font-size:14px;
  margin:20px 5px;
  line-height:1.7;
}

@media(max-width:420px){
  h1{font-size:29px}
  .wrap{padding:14px}
  .lookup input{font-size:17px}
  .showBtn{width:90px}
  .passid{font-size:34px}
}
</style>
</head>

<body>

<div class="wrap">

  <div class="lang-area">
    <div class="lang-switch">

      <button
        id="arBtn"
        type="button"
        onclick="setLanguage('ar')">
        العربية
      </button>

      <button
        id="enBtn"
        type="button"
        onclick="setLanguage('en')">
        English
      </button>

    </div>
  </div>


  <div class="hero">

    <img
      class="logo"
      src="./IMG_6646.jpeg"
      alt="TSK Active Company">

    <h1>TSK 96 ACTIVE PASS</h1>

    <div
      class="subtitle"
      id="subtitle">
      بطاقتك الرياضية في فروع TSK Active
    </div>

  </div>


  <div class="card">

    <div class="lookup">

      <input
        id="passInput"
        placeholder="رقم الجوال أو رقم البطاقة"
        autocomplete="off"
      >

      <button
        class="showBtn"
        id="showBtn"
        type="button">
        عرض
      </button>

    </div>


    <div
      class="note"
      id="lookupNote">
      أدخل رقم الجوال أو رقم البطاقة أو امسح الباركود.
    </div>


    <div
      class="or"
      id="orText">
      أو
    </div>


    <button
      class="scanBtn"
      id="scanBtn"
      type="button">
      ▣ &nbsp; مسح الباركود
    </button>


    <div
      id="scannerBox"
      class="hidden">

      <div id="reader"></div>

      <button
        class="closeBtn"
        id="closeBtn"
        type="button">
        إغلاق الكاميرا
      </button>

    </div>


    <div id="error"></div>

  </div>


  <div
    id="result"
    class="card result hidden">

    <div
      id="pid"
      class="passid">
    </div>

    <div
      id="status"
      class="status">
    </div>

    <div
      id="progress"
      class="progress">
    </div>


    <div class="details">

      <div class="row">
        <b id="usedLabel">
          الزيارات المستخدمة
        </b>
        <span id="used"></span>
      </div>

      <div class="row">
        <b id="leftLabel">
          الزيارات المتبقية
        </b>
        <span
          id="left"
          class="ok">
        </span>
      </div>

      <div class="row">
        <b id="cupLabel">
          الكوب
        </b>
        <span id="cup"></span>
      </div>

    </div>

  </div>


  <div
    class="footer"
    id="footerText">
    يتم تحديث الزيارات تلقائياً عند تسجيلها
    في أي فرع من فروع TSK Active.
  </div>

</div>


<script>

const cfg =
  window.TSK96_CONFIG ||
  window.CONFIG ||
  window.config ||
  {};

const $ =
  id => document.getElementById(id);


let currentLang =
  localStorage.getItem("tsk96_lang") || "ar";

let currentPassData = null;
let scanner = null;


/* =========================
   اللغة
========================= */

const texts = {

  ar:{
    title:"بطاقتي | TSK 96 Active Pass",

    subtitle:
      "بطاقتك الرياضية في فروع TSK Active",

    lookupPlaceholder:
      "رقم الجوال أو رقم البطاقة",

    show:"عرض",

    note:
      "أدخل رقم الجوال أو رقم البطاقة أو امسح الباركود.",

    or:"أو",

    scan:"▣  مسح الباركود",

    closeCamera:
      "إغلاق الكاميرا",

    usedLabel:
      "الزيارات المستخدمة",

    leftLabel:
      "الزيارات المتبقية",

    cupLabel:
      "الكوب",

    footer:
      "يتم تحديث الزيارات تلقائياً عند تسجيلها في أي فرع من فروع TSK Active.",

    connecting:
      "تعذر الاتصال بالنظام.",

    loading:
      "جاري تحميل البطاقة...",

    notFound:
      "لم يتم العثور على بطاقة مطابقة.",

    loadError:
      "تعذر تحميل البطاقة. حاول مرة أخرى.",

    cameraError:
      "تعذر تشغيل الكاميرا. اسمح للموقع باستخدام الكاميرا ثم حاول مرة أخرى.",

    stopped:
      "البطاقة موقوفة",

    notActivated:
      "متاحة ولم تُفعّل",

    completed:
      "اكتملت الزيارات",

    active:
      "البطاقة فعّالة",

    from:
      "من",

    visits:
      "زيارات",

    visit:
      "زيارة",

    cupReceived:
      "✓ تم الاستلام",

    cupNotReceived:
      "لم يتم الاستلام"
  },


  en:{
    title:
      "My Pass | TSK 96 Active Pass",

    subtitle:
      "Your fitness pass across TSK Active branches",

    lookupPlaceholder:
      "Mobile number or pass number",

    show:
      "View",

    note:
      "Enter your mobile number or pass number, or scan the QR code.",

    or:
      "OR",

    scan:
      "▣  Scan QR Code",

    closeCamera:
      "Close Camera",

    usedLabel:
      "Visits Used",

    leftLabel:
      "Visits Remaining",

    cupLabel:
      "Cup",

    footer:
      "Visits are updated automatically when registered at any TSK Active branch.",

    connecting:
      "Unable to connect to the system.",

    loading:
      "Loading pass...",

    notFound:
      "No matching pass was found.",

    loadError:
      "Unable to load the pass. Please try again.",

    cameraError:
      "Unable to start the camera. Please allow camera access and try again.",

    stopped:
      "Pass Suspended",

    notActivated:
      "Available — Not Activated",

    completed:
      "Visits Completed",

    active:
      "Pass Active",

    from:
      "of",

    visits:
      "Visits",

    visit:
      "Visit",

    cupReceived:
      "✓ Received",

    cupNotReceived:
      "Not Received"
  }

};


function tr(key){
  return texts[currentLang][key] || key;
}


function setLanguage(lang){

  currentLang =
    lang === "en"
      ? "en"
      : "ar";

  localStorage.setItem(
    "tsk96_lang",
    currentLang
  );

  applyLanguage();
}


function applyLanguage(){

  const en =
    currentLang === "en";


  document.documentElement.lang =
    en ? "en" : "ar";


  document.documentElement.dir =
    en ? "ltr" : "rtl";


  document.title =
    tr("title");


  $("subtitle").textContent =
    tr("subtitle");


  $("passInput").placeholder =
    tr("lookupPlaceholder");


  $("showBtn").textContent =
    tr("show");


  $("lookupNote").textContent =
    tr("note");


  $("orText").textContent =
    tr("or");


  $("scanBtn").textContent =
    tr("scan");


  $("closeBtn").textContent =
    tr("closeCamera");


  $("usedLabel").textContent =
    tr("usedLabel");


  $("leftLabel").textContent =
    tr("leftLabel");


  $("cupLabel").textContent =
    tr("cupLabel");


  $("footerText").textContent =
    tr("footer");


  $("arBtn")
    .classList.toggle(
      "active",
      !en
    );


  $("enBtn")
    .classList.toggle(
      "active",
      en
    );


  if(currentPassData){
    renderPass(currentPassData);
  }
}


/* =========================
   تنسيق رقم البطاقة
========================= */

function normalizePass(v){

  v = String(v || "")
      .trim()
      .toUpperCase();

  if(!v){
    return "";
  }


  const urlMatch =
    v.match(/[?&]id=([^&#]+)/i);


  if(urlMatch){

    try{

      v =
        decodeURIComponent(
          urlMatch[1]
        );

    }catch(e){

      v =
        urlMatch[1];
    }


    v =
      v.trim().toUpperCase();
  }


  if(
    /^\d{1,3}$/.test(v)
  ){

    return "TSK96-" +
      v.padStart(
        3,
        "0"
      );
  }


  if(
    /^TSK96[- ]?\d{1,3}$/.test(v)
  ){

    const number =
      v.match(/\d{1,3}$/);


    if(number){

      return "TSK96-" +
        number[0].padStart(
          3,
          "0"
        );
    }
  }


  return v;
}


/* =========================
   عرض البطاقة
========================= */

function renderPass(p){

  if(!p) return;


  currentPassData =
    p;


  const count =
    Math.max(
      0,
      Math.min(
        3,
        Number(
          p.visit_count || 0
        )
      )
    );


  $("pid").textContent =
    p.id;


  if(!p.active){

    $("status").textContent =
      tr("stopped");

  }else if(!p.paid){

    $("status").textContent =
      tr("notActivated");

  }else if(count >= 3){

    $("status").textContent =
      tr("completed");

  }else{

    $("status").textContent =
      tr("active");
  }


  if(currentLang === "en"){

    $("used").textContent =
      count + " of 3";

    $("left").textContent =
      Math.max(
        0,
        3 - count
      ) +
      " " +
      tr("visits");

  }else{

    $("used").textContent =
      count +
      " " +
      tr("from") +
      " 3";

    $("left").textContent =
      Math.max(
        0,
        3 - count
      ) +
      " " +
      tr("visits");
  }


  $("cup").textContent =
    p.cup_received
      ? tr("cupReceived")
      : tr("cupNotReceived");


  $("cup").className =
    p.cup_received
      ? "ok"
      : "muted";


  $("progress").innerHTML =
    [1,2,3]
    .map(n => `

      <div class="visit ${count >= n ? "done" : ""}">

        <strong>${n}</strong>

        <span>
          ${tr("visit")} ${n}
        </span>

      </div>

    `)
    .join("");


  $("result")
    .classList.remove(
      "hidden"
    );
}


/* =========================
   تحميل البطاقة
========================= */

async function loadCustomerPass(raw){

  const input =
    $("passInput");

  const result =
    $("result");

  const errBox =
    $("error");


  const value =
    (raw || input.value || "")
    .trim();


  const digits =
    value.replace(
      /\D/g,
      ""
    );


  let phoneSearch =
    "";

  let id =
    "";


  if(
    /^05\d{8}$/.test(digits)
  ){

    phoneSearch =
      digits;

  }

  else if(
    /^9665\d{8}$/.test(digits)
  ){

    phoneSearch =
      "0" +
      digits.slice(3);

  }

  else if(
    /^009665\d{8}$/.test(digits)
  ){

    phoneSearch =
      "0" +
      digits.slice(5);

  }

  else{

    id =
      normalizePass(
        value
      );
  }


  input.value =
    phoneSearch || id;


  result.classList.add(
    "hidden"
  );


  errBox.textContent =
    "";


  if(
    !id &&
    !phoneSearch
  ){
    return;
  }


  if(
    !cfg.SUPABASE_URL ||
    !cfg.SUPABASE_ANON_KEY
  ){

    errBox.style.color =
      "#b42318";


    errBox.textContent =
      tr("connecting");


    return;
  }


  errBox.style.color =
    "#748078";


  errBox.textContent =
    tr("loading");


  try{

    const base =
      cfg.SUPABASE_URL
      .replace(
        /\/$/,
        ""
      );


    const filter =
      phoneSearch

      ? "phone=eq." +
        encodeURIComponent(
          phoneSearch
        )

      : "id=eq." +
        encodeURIComponent(
          id
        );


    const url =
      base +
      "/rest/v1/tsk96_passes" +
      "?select=id,active,paid,visit_count,cup_received&" +
      filter +
      "&limit=1";


    const r =
      await fetch(
        url,
        {

          method:"GET",

          headers:{

            "apikey":
              cfg.SUPABASE_ANON_KEY,

            "Authorization":
              "Bearer " +
              cfg.SUPABASE_ANON_KEY

          }

        }
      );


    if(!r.ok){

      throw new Error(
        "HTTP " +
        r.status
      );
    }


    const rows =
      await r.json();


    const p =
      rows &&
      rows[0];


    if(!p){

      errBox.style.color =
        "#b42318";


      errBox.textContent =
        tr("notFound");


      return;
    }


    currentPassData =
      p;


    renderPass(p);


    errBox.textContent =
      "";


  }catch(e){

    console.error(e);


    errBox.style.color =
      "#b42318";


    errBox.textContent =
      tr("loadError");
  }
}


/* =========================
   QR
========================= */

async function startScanner(){

  const box =
    $("scannerBox");


  const errBox =
    $("error");


  errBox.textContent =
    "";


  box.classList.remove(
    "hidden"
  );


  try{

    scanner =
      new Html5Qrcode(
        "reader"
      );


    await scanner.start(

      {
        facingMode:
          "environment"
      },

      {
        fps:10,

        qrbox:{
          width:230,
          height:230
        }
      },


      async decodedText => {

        let scanned =
          decodedText;


        try{

          const u =
            new URL(
              decodedText
            );


          scanned =
            u.searchParams
            .get("id")
            ||
            decodedText;

        }catch(e){}


        $("passInput").value =
          scanned;


        await stopScanner();


        loadCustomerPass(
          scanned
        );

      },


      () => {}

    );


  }catch(e){

    console.error(e);


    box.classList.add(
      "hidden"
    );


    errBox.style.color =
      "#b42318";


    errBox.textContent =
      tr("cameraError");
  }
}


async function stopScanner(){

  if(scanner){

    try{

      if(scanner.isScanning){

        await scanner.stop();
      }


      await scanner.clear();


    }catch(e){}


    scanner =
      null;
  }


  $("scannerBox")
    .classList.add(
      "hidden"
    );
}


/* =========================
   الأزرار
========================= */

$("showBtn")
  .addEventListener(
    "click",
    () =>
      loadCustomerPass()
  );


$("scanBtn")
  .addEventListener(
    "click",
    startScanner
  );


$("closeBtn")
  .addEventListener(
    "click",
    stopScanner
  );


$("passInput")
  .addEventListener(
    "keydown",
    e => {

      if(
        e.key === "Enter"
      ){

        loadCustomerPass();
      }

    }
  );


/* =========================
   تشغيل الصفحة
========================= */

window.addEventListener(
  "load",
  () => {

    applyLanguage();


    const q =
      new URLSearchParams(
        location.search
      ).get("id");


    if(q){

      $("passInput").value =
        q;


      loadCustomerPass(
        q
      );
    }

  }
);

</script>

</body>
</html>
